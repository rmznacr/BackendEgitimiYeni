services:

  postgres:
    image: pgvector/pgvector:pg18
    container_name: backend-postgres

    environment:
      POSTGRES_DB: BackendDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d BackendDb
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: backend-api

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=BackendDb;Username=postgres;Password=${POSTGRES_PASSWORD}

      Jwt__Key: ${JWT_KEY}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: