name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BackendEgitimiYeni.Tests/BackendEgitimiYeni.Tests.csproj

      - name: Build
        run: dotnet build BackendEgitimiYeni.Tests/BackendEgitimiYeni.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test BackendEgitimiYeni.Tests/BackendEgitimiYeni.Tests.csproj --no-build --verbosity normal
