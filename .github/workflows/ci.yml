name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: .NET 10 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test projesini derle ve testleri çalıştır
        run: dotnet test BackendEgitimiYeni.Tests/BackendEgitimiYeni.Tests.csproj --configuration Release